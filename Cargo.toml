[package]
name = "feedpush"
version = "0.1.4"
edition = "2021"
description = "RSSHub → Telegram digest (dedupe, no_agent friendly)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"
roxmltree = "0.20"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
